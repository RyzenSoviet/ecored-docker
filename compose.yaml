services:
    api:
        build: .
        # Reconstruye la imagen en cada `docker compose up -d`; la caché de capas evita reinstalar dependencias.
        pull_policy: build
        # Conexión a una MySQL existente, configurada en .env.
        environment:
            DB_HOST: ${DB_HOST:?Configura DB_HOST en .env}
            DB_PORT: ${DB_PORT:-3306}
            DB_NAME: ${DB_NAME:-ecored}
            DB_USER: ${DB_USER:-ecored}
            DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
            INGEST_API_KEY: ${INGEST_API_KEY:?Configura INGEST_API_KEY en .env}
        ports:
            - "8014:8000"
        restart: unless-stopped
